name: Deploy

# Manual only: deploys the Worker and applies pending D1 migrations.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Migrations read web/wrangler.jsonc; run them before the build writes the redirected config.
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npm run build
      - run: npx wrangler deploy
