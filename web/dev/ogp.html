<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<title>OGP image source (dev only)</title>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@700&display=swap" />
		<style>
			body { margin: 0; }
			.og {
				position: relative; width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
				padding: 70px 80px; color: #1d2830; background: #f5efe1;
				background-image: repeating-linear-gradient(to bottom, transparent 0 55px, rgba(60, 90, 120, 0.13) 55px 57px);
				font-family: "Zen Kaku Gothic New", sans-serif;
			}
			.og__title { margin: 16px 0 0; font: 800 112px/1.08 "Shippori Mincho B1", serif; letter-spacing: 0.02em; }
			.og__lead { margin: 22px 0 0; font-size: 34px; font-weight: 700; }
			.og__tag { display: inline-block; margin-top: 34px; padding: 6px 18px; font-size: 30px; font-weight: 700; color: #d62a1e; border: 4px solid #d62a1e; border-radius: 8px; transform: rotate(-2deg); }
			.og__mark { position: absolute; right: 50px; top: 60px; width: 270px; transform: rotate(-8deg); }
			.og__score { position: absolute; right: 90px; bottom: 60px; font: 600 120px/1 "Klee One", cursive; color: #d62a1e; transform: rotate(-6deg); }
			.og__score small { font-size: 0.45em; }
		</style>
	</head>
	<body>
		<!-- Dev-only source of assets/og.png (captured at 1200×630); not part of the build. -->
		<div class="og" id="og">
			<p class="og__title">もーたる<br />何切る教室</p>
			<p class="og__lead">麻雀AI（mortal-298k）の評価で採点する何切る問題</p>
			<span class="og__tag">登録不要・1万問</span>
			<div class="og__mark" id="mark"></div>
			<div class="og__score">100<small>点</small></div>
		</div>
		<script type="module" src="./ogp.ts"></script>
	</body>
</html>
